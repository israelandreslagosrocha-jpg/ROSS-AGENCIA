name: Verificar y empaquetar demo ROSS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validar demo
        run: npm run check
      - name: Empaquetar sitio estático
        run: npm run build
      - name: Verificar paquete SEO para publicación futura
        run: npm run build:production
      - name: Guardar paquete de vista previa
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ross-demo-estatica
          path: dist/
          retention-days: 7
          if-no-files-found: error
